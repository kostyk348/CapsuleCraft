name: Feature request
description: Suggest an idea or an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first — the feature is only interesting as its solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who hits it, when, and what do they do today instead?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - UI / UX
        - Core engine
        - Data format
        - Performance
        - Packaging / install
        - Docs
        - Other
    validations:
      required: true

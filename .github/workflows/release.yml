name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pre-flight step: ensures the GitHub Release exists before any parallel
  # builder attempts to upload assets to it. This eliminates the race condition
  # where fast native builders finish before the release object is created.
  create-release:
    name: Prepare GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag and version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v$(awk -F'"' '/^version = /{print $2; exit}' native/Cargo.toml)"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.vars.outputs.tag }}"
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            echo "Creating draft release $TAG..."
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" \
                --title "CapsuleCraft $TAG" \
                --draft \
                --notes-file "$NOTES" \
                --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" \
                --title "CapsuleCraft $TAG" \
                --draft \
                --generate-notes \
                --repo "$GITHUB_REPOSITORY"
            fi
          fi

  # Native Windows shell: the egui executable packaged BOTH as an NSIS
  # installer (start-menu/desktop shortcuts, uninstaller) and as a zero-
  # dependency portable zip. Neither needs WebView2 or any runtime.
  native-windows:
    name: "Native Windows app (x64): installer + portable"
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build native shell
        run: cargo build --release --manifest-path native/Cargo.toml --bin capsuleos-native

      - name: Package Windows portable zip
        shell: pwsh
        run: |
          $Version = "${{ needs.create-release.outputs.version }}"
          $OutDir = "CapsuleCraft_native_${Version}_x64"
          New-Item -ItemType Directory -Path $OutDir -Force
          Copy-Item native/target/release/capsuleos-native.exe "$OutDir/CapsuleCraft.exe"
          Copy-Item README.md, LICENSE "$OutDir/"
          Compress-Archive -Path "$OutDir/*" -DestinationPath "${OutDir}.zip" -Force
          Get-Item "${OutDir}.zip"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if (Test-Path "C:\Program Files (x86)\NSIS\makensis.exe") {
            Write-Host "NSIS installed."
          } else {
            Get-ChildItem "C:\Program Files (x86)\NSIS" -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Sign Windows binary and installer (Authenticode, optional)
        env:
          WINDOWS_CERT_PFX_BASE64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        shell: pwsh
        run: |
          if (-not $env:WINDOWS_CERT_PFX_BASE64) {
            Write-Host "No WINDOWS_CERT_PFX_BASE64 secret - shipping unsigned (see docs/SIGNING.md)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_PFX_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1
          if (-not $signtool) { throw "signtool.exe not found" }
          $files = @(Get-ChildItem -Recurse -Include "capsuleos-native.exe","CapsuleCraft_*_setup.exe" -Path .)
          foreach ($f in $files) {
            & $signtool.FullName sign /fd SHA256 /td http://timestamp.digicert.com `
              /tr http://timestamp.digicert.com /f $pfx /p $env:WINDOWS_CERT_PASSWORD $f.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($f.FullName)" }
          }
          Remove-Item $pfx -Force

      - name: Build NSIS installer (setup.exe)
        shell: pwsh
        run: |
          $Version = "${{ needs.create-release.outputs.version }}"
          Copy-Item native/target/release/capsuleos-native.exe native/packaging/CapsuleCraft.exe
          Copy-Item README.md, LICENSE native/packaging/
          Copy-Item native/assets/icon.ico native/packaging/icon.ico
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=$Version native/packaging/windows-installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "native/packaging/CapsuleCraft_${Version}_x64-setup.exe"

      - name: Upload Windows installer + portable zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $Tag = "${{ needs.create-release.outputs.tag }}"
          $Version = "${{ needs.create-release.outputs.version }}"
          gh release upload $Tag `
            "native/packaging/CapsuleCraft_${Version}_x64-setup.exe" `
            "CapsuleCraft_native_${Version}_x64.zip" `
            --clobber

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsulecraft-native-windows-x64
          path: |
            native/packaging/CapsuleCraft_*_x64-setup.exe
            CapsuleCraft_native_*_x64.zip

  # The recommended Linux artifact: the native egui shell as a standalone,
  # zero-dependency AppImage. Built on ubuntu-22.04 so the bundled binary
  # references glibc 2.35 (not a rolling-distro glibc), which keeps the
  # package self-contained per the appimage.github.io catalog checks.
  native-appimage:
    name: Native AppImage (zero-dep, ubuntu-22.04)
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libx11-xcb-dev \
            libwayland-dev \
            libfontconfig1-dev libfreetype6-dev \
            libssl-dev \
            libasound2-dev pkg-config \
            libxkbcommon-x11-0 libxkbcommon0 \
            libx11-6 libx11-xcb1 libxcb1 \
            libxcursor1 libxrandr2 libxi6 \
            libxfixes3 libxrender1 libxext6 \
            libxau6 libxdmcp6 \
            libwayland-client0

      - name: Build native shell
        run: cargo build --release --manifest-path native/Cargo.toml --bin capsuleos-native

      - name: Assemble AppDir
        run: |
          set -e
          APPDIR=native/packaging/AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"/usr/bin \
                   "$APPDIR"/usr/lib \
                   "$APPDIR"/usr/share/applications \
                   "$APPDIR"/usr/share/icons/hicolor/256x256/apps
          install -m 0755 native/target/release/capsuleos-native "$APPDIR"/usr/bin/capsuleos-native
          cp native/assets/icon.png \
             "$APPDIR"/usr/share/icons/hicolor/256x256/apps/capsulecraft.png
          ln -s usr/bin/capsuleos-native "$APPDIR"/AppRun
          ln -s capsulecraft.png "$APPDIR"/.DirIcon
          # winit/x11-dl/xkbcommon-dl load these with dlopen() at runtime, which
          # linuxdeploy cannot see (no DT_NEEDED). Bundle them (plus transitive
          # deps) explicitly so the app works in minimal/firejail environments.
          LIB=/usr/lib/x86_64-linux-gnu
          for f in \
            libxkbcommon.so.0 libxkbcommon-x11.so.0 \
            libX11.so.6 libX11-xcb.so.1 libxcb.so.1 \
            libXcursor.so.2 libXrandr.so.2 libXi.so.6 \
            libXfixes.so.3 libXrender.so.1 libXext.so.6 \
            libXau.so.6 libXdmcp.so.6 \
            libwayland-client.so.0 libffi.so.8 \
            ; do
            cp -L "$LIB/$f" "$APPDIR"/usr/lib/ || echo "WARN: missing $LIB/$f"
          done
          # Make sure nothing inside the AppImage points at a missing file.
          if find "$APPDIR"/usr/lib -xtype l | grep -q .; then
            echo "ERROR: broken symlinks in AppDir/usr/lib:"
            find "$APPDIR"/usr/lib -xtype l -printf '%p -> %l\n'
            exit 1
          fi
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=CapsuleCraft' \
            'GenericName=Knowledge base as mail' \
            'Comment=Your knowledge base is a folder of emails (.eml). Offline, zero DB.' \
            'Exec=capsuleos-native' \
            'Icon=capsulecraft' \
            'Categories=Office;TextEditor;Development;' \
            'Keywords=notes;knowledge;eml;email;offline;' \
            'StartupWMClass=capsuleos-native' \
            'Type=Application' \
            'Terminal=false' \
            > native/packaging/AppDir/usr/share/applications/capsulecraft.desktop
          mkdir -p native/packaging/AppDir/usr/share/metainfo
          VERSION="${{ needs.create-release.outputs.version }}"
          RELDATE="$(date -u +%Y-%m-%d)"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<component type="desktop-application">' \
            '  <id>com.capsuleos.CapsuleCraft</id>' \
            '  <name>CapsuleCraft</name>' \
            '  <summary>Offline knowledge base stored as a folder of .eml files</summary>' \
            '  <metadata_license>MIT</metadata_license>' \
            '  <project_license>MIT</project_license>' \
            '  <description>' \
            '    <p>CapsuleCraft stores every note as a standards-compliant email (.eml) file in a folder you own. No database, no account, no network required.</p>' \
            '    <p>Native egui shell, built-in FAQ, Markdown blocks, attachments, search, and an optional IMAP mailbox sync.</p>' \
            '  </description>' \
            '  <launchable type="desktop-id">capsulecraft.desktop</launchable>' \
            '  <url type="homepage">https://github.com/kostyk348/CapsuleCraft</url>' \
            '  <categories>' \
            '    <category>Office</category>' \
            '    <category>Utility</category>' \
            '  </categories>' \
            '  <releases>' \
            "    <release version=\"${VERSION}\" date=\"${RELDATE}\"/>" \
            '  </releases>' \
            '</component>' \
            > native/packaging/AppDir/usr/share/metainfo/com.capsuleos.CapsuleCraft.appdata.xml

      - name: Package AppImage (linuxdeploy, bundles shared libs)
        run: |
          set -e
          curl -sSL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          export VERSION="${{ needs.create-release.outputs.version }}"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy.AppImage \
            --appdir native/packaging/AppDir \
            -d native/packaging/AppDir/usr/share/applications/capsulecraft.desktop \
            -i native/packaging/AppDir/usr/share/icons/hicolor/256x256/apps/capsulecraft.png \
            --output appimage
          FILE="CapsuleCraft_${VERSION}_amd64.AppImage"
          OUT=$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*' -print -quit)
          [ -n "$OUT" ] || { ls; echo "linuxdeploy produced no AppImage"; exit 1; }
          mv -f "$OUT" "$FILE"
          test -f "$FILE"

      - name: Package .deb (system install, apt-friendly)
        run: |
          set -e
          VERSION="${{ needs.create-release.outputs.version }}"
          ROOT="native/packaging/debroot/capsulecraft_${VERSION}_amd64"
          rm -rf native/packaging/debroot
          mkdir -p "$ROOT/DEBIAN" "$ROOT/usr/bin" \
                   "$ROOT/usr/share/applications" \
                   "$ROOT/usr/share/icons/hicolor/256x256/apps"
          install -m 0755 native/target/release/capsuleos-native \
            "$ROOT/usr/bin/capsuleos-native"
          cp native/packaging/AppDir/usr/share/applications/capsulecraft.desktop \
            "$ROOT/usr/share/applications/"
          cp native/packaging/AppDir/usr/share/icons/hicolor/256x256/apps/capsulecraft.png \
            "$ROOT/usr/share/icons/hicolor/256x256/apps/"
          printf '%s\n' \
            'Package: capsulecraft' \
            "Version: ${VERSION}" \
            'Section: utils' \
            'Priority: optional' \
            'Architecture: amd64' \
            'Maintainer: kostyk348 <kostyk348@users.noreply.github.com>' \
            'Depends: libxkbcommon0, libxkbcommon-x11-0, libxcb1, libx11-6, libxcursor1, libxrandr2, libxi6, libwayland-client0, libfontconfig1, libasound2 | libasound2t64' \
            'Description: Offline knowledge base stored as a folder of .eml files' \
            ' Native egui shell: notes as RFC-822 emails, full-text search,' \
            ' planning, graph view and downloadable local AI components.' \
            ' No database, no webview, no cloud.' \
            > "$ROOT/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$ROOT"
          mv "native/packaging/debroot/capsulecraft_${VERSION}_amd64.deb" \
            "CapsuleCraft_${VERSION}_amd64.deb"
          test -f "CapsuleCraft_${VERSION}_amd64.deb"

      - name: Package .rpm (dnf / zypper friendly)
        run: |
          set -e
          VERSION="${{ needs.create-release.outputs.version }}"
          curl -sSfL -o /tmp/nfpm.tgz \
            https://github.com/goreleaser/nfpm/releases/download/v2.41.1/nfpm_2.41.1_Linux_x86_64.tar.gz
          tar -xzf /tmp/nfpm.tgz -C /tmp nfpm
          install -m 0755 native/target/release/capsuleos-native native/packaging/capsuleos-native
          cat > /tmp/nfpm.yaml <<'NFPM'
          name: capsulecraft
          arch: amd64
          platform: linux
          version: "${VERSION}"
          section: utils
          priority: optional
          maintainer: kostyk348 <kostyk348@users.noreply.github.com>
          description: |
            Offline knowledge base stored as a folder of .eml files.
            Native egui shell: notes as RFC-822 emails, full-text search, planning,
            graph view and downloadable local AI components. No database, no webview, no cloud.
          license: MIT
          homepage: https://github.com/kostyk348/CapsuleCraft
          contents:
            - src: native/packaging/capsuleos-native
              dst: /usr/bin/capsulecraft
              file_info:
                mode: 0755
                owner: root
                group: root
            - src: native/packaging/AppDir/usr/share/applications/capsulecraft.desktop
              dst: /usr/share/applications/capsulecraft.desktop
            - src: native/packaging/AppDir/usr/share/icons/hicolor/256x256/apps/capsulecraft.png
              dst: /usr/share/icons/hicolor/256x256/apps/capsulecraft.png
          NFPM
          VERSION="$VERSION" /tmp/nfpm package -f /tmp/nfpm.yaml -p rpm \
            --target "CapsuleCraft_${VERSION}_x86_64.rpm"
          test -f "CapsuleCraft_${VERSION}_x86_64.rpm"

      - name: Upload AppImage and deb to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ needs.create-release.outputs.tag }}"
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload "$TAG" \
            "CapsuleCraft_${VERSION}_amd64.AppImage" \
            "CapsuleCraft_${VERSION}_amd64.deb" \
            "CapsuleCraft_${VERSION}_x86_64.rpm" \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsulecraft-native-linux
          path: |
            CapsuleCraft_*_amd64.AppImage
            CapsuleCraft_*_amd64.deb
            CapsuleCraft_*_x86_64.rpm

  # Native macOS bundle: the same egui shell assembled into a .app with an
  # ad-hoc signature, so an unzipped local launch is not blocked outright.
  # One universal (arm64 + x86_64) binary via lipo — a single download works
  # on both Apple Silicon and Intel Macs.
  native-macos:
    name: "Native macOS app (universal: arm64 + x64)"
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build native shell (arm64 + x64)
        run: |
          set -e
          cargo build --release --manifest-path native/Cargo.toml --bin capsuleos-native
          cargo build --release --manifest-path native/Cargo.toml --target x86_64-apple-darwin --bin capsuleos-native
          lipo -create \
            native/target/release/capsuleos-native \
            native/target/x86_64-apple-darwin/release/capsuleos-native \
            -output capsuleos-native-universal
          lipo -info capsuleos-native-universal

      - name: Assemble .app bundle
        run: |
          set -e
          VERSION="${{ needs.create-release.outputs.version }}"
          APP=CapsuleCraft.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          install -m 0755 capsuleos-native-universal "$APP/Contents/MacOS/capsuleos-native"
          cp native/assets/icon.icns "$APP/Contents/Resources/capsulecraft.icns"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>CFBundleName</key><string>CapsuleCraft</string>' \
            '  <key>CFBundleDisplayName</key><string>CapsuleCraft</string>' \
            '  <key>CFBundleIdentifier</key><string>com.capsuleos.capsulecraft</string>' \
            '  <key>CFBundleExecutable</key><string>capsuleos-native</string>' \
            '  <key>CFBundleIconFile</key><string>capsulecraft</string>' \
            '  <key>CFBundlePackageType</key><string>APPL</string>' \
            "  <key>CFBundleShortVersionString</key><string>${VERSION}</string>" \
            "  <key>CFBundleVersion</key><string>${VERSION}</string>" \
            '  <key>LSMinimumSystemVersion</key><string>11.0</string>' \
            '  <key>NSHighResolutionCapable</key><true/>' \
            '</dict>' \
            '</plist>' \
            > "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"

      # v1.12.4 (rerun): hdiutil died with "No space left on device" —
      # two release targets + the restored rust-cache fill the runner disk.
      # The .app is assembled and signed by now, so the whole build tree
      # (dozens of GB) is dead weight: throw it away before making the dmg.
      - name: Free disk space
        run: |
          set -e
          df -H /
          rm -rf native/target ~/.cargo/registry/src ~/.cargo/registry/cache
          df -H /

      - name: Package .dmg (drag-to-Applications)
        run: |
          set -e
          VERSION="${{ needs.create-release.outputs.version }}"
          STAGING="CapsuleCraft_${VERSION}-dmg"
          rm -rf "$STAGING"
          mkdir -p "$STAGING"
          cp -R CapsuleCraft.app "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "CapsuleCraft ${VERSION}" \
            -srcfolder "$STAGING" -ov -format UDZO \
            "CapsuleCraft_${VERSION}_macos_universal.dmg"

      - name: Upload macOS dmg to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ needs.create-release.outputs.tag }}"
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload "$TAG" \
            "CapsuleCraft_${VERSION}_macos_universal.dmg" \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsulecraft-native-macos
          path: CapsuleCraft_*_macos_universal.dmg

  # OCR engine for the Integrations catalog: mistral.rs (pure Rust, MIT)
  # pinned at v0.9.5, built CPU-only and shipped as a downloadable component.
  # The `--help` step validates the serve subcommand shape the app relies on.
  ocr-engine:
    name: OCR engine (mistral.rs) — ${{ matrix.name }}
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-22.04
            artifact: mistralrs-engine-linux-x64.tar.gz
            bin: mistralrs
          - name: macos-arm64
            os: macos-latest
            artifact: mistralrs-engine-macos-arm64.tar.gz
            bin: mistralrs
          - name: windows-x64
            os: windows-latest
            artifact: mistralrs-engine-windows-x64.tar.gz
            bin: mistralrs.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build mistral.rs engine (CPU)
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo install --git https://github.com/EricLBuehler/mistral.rs --tag v0.9.5 mistralrs-cli --locked --no-default-features

      - name: Validate serve subcommand
        run: |
          mistralrs --help
          mistralrs serve --help
          mistralrs serve multimodal --help

      - name: Package engine
        shell: bash
        run: |
          set -e
          BIN_DIR="$(dirname "$(command -v mistralrs)")"
          tar czf "${{ matrix.artifact }}" -C "$BIN_DIR" "${{ matrix.bin }}"
          ls -la "${{ matrix.artifact }}"

      - name: Upload engine to the release
        # This job has no checkout, so gh cannot resolve the repository from
        # the local git remotes. GH_REPO is shell-independent (the default
        # shell on Windows is pwsh, where "$GITHUB_REPOSITORY" expands to an
        # empty string and the --repo flag silently broke the upload).
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "${{ needs.create-release.outputs.tag }}" "${{ matrix.artifact }}" --clobber

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: mistralrs-engine-${{ matrix.name }}
          path: ${{ matrix.artifact }}

  # Android: the NativeActivity shell built for arm64-v8a and packaged as a
  # SIGNED release APK (stable keystore from repo secrets; an ephemeral CI
  # key is generated when the secrets are absent, and its certificate digest
  # is printed so installs can be compared across runs).
  android-apk:
    name: Android APK (arm64-v8a, signed release)
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Prepare signing keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -e
          mkdir -p android/keystore
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/keystore/capsulecraft-release.keystore
            echo "Signed with the ANDROID_KEYSTORE_BASE64 secret."
          elif [ -f android/keystore/capsulecraft-release.keystore ]; then
            # No secret storage: the repo carries its own release key (see
            # android/keystore/README.md) so upgrades keep the same signature.
            # The password lives in that README — it is public by design.
            KS_PASS=c88f596eab12ed8a2d11b84904da1d26
            KS_ALIAS=capsulecraft
            echo "Signed with the committed android/keystore key."
          else
            echo "Keystore secrets absent — generating an EPHEMERAL release key."
            keytool -genkeypair -v \
              -keystore android/keystore/capsulecraft-release.keystore \
              -alias capsulecraft -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass capsulecraft -keypass capsulecraft \
              -dname "CN=CapsuleCraft Release, O=CapsuleCraft, C=RU"
            KS_PASS=capsulecraft
            KS_ALIAS=capsulecraft
          fi
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KS_ALIAS=$KS_ALIAS" >> "$GITHUB_ENV"
          keytool -list -v \
            -keystore android/keystore/capsulecraft-release.keystore \
            -storepass "$KS_PASS" 2>/dev/null | grep 'SHA256:' || true

      # --lib: on Android the app is the cdylib (android_main), not the bin.
      - name: Build native lib (arm64-v8a)
        working-directory: native
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release --lib

      # cpal pulls in oboe (C++), so libcapsuleos_native.so carries a
      # DT_NEEDED on libc++_shared.so — but cargo-ndk does not copy that
      # runtime from the NDK into jniLibs. Without it dlopen fails and the
      # app dies instantly on launch (v2.12.3 shipped exactly that).
      - name: Bundle libc++_shared.so (oboe/cpal runtime)
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          SRC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so"
          DST="android/app/src/main/jniLibs/arm64-v8a/libc++_shared.so"
          test -f "$SRC" || { echo "libc++_shared.so not found in the NDK sysroot"; exit 1; }
          cp -f "$SRC" "$DST"
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Assemble signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ github.workspace }}/android/keystore/capsulecraft-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ env.KS_PASS }}
          ANDROID_KEY_ALIAS: ${{ env.KS_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ env.KS_PASS }}
        run: gradle assembleRelease --no-daemon
      # Gate: every DT_NEEDED of every packaged .so must be a system lib or
      # be packaged too (plus 16 KB alignment and the NativeActivity export).
      # This is what catches a repeat of the v2.12.3 launch crash.
      - name: Verify APK native dependencies
        run: python3 scripts/check_apk_native_deps.py android/app/build/outputs/apk/release/*.apk


      - name: Upload APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          VERSION="${{ needs.create-release.outputs.version }}"
          SRC=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          OUT="CapsuleCraft_${VERSION}_android_arm64.apk"
          cp "$SRC" "$OUT"
          gh release upload "${{ needs.create-release.outputs.tag }}" "$OUT" --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: capsulecraft-android-arm64
          path: CapsuleCraft_*_android_arm64.apk

  # Finalization step: runs once all parallel build jobs have finished.
  # Downloads all release assets, computes a single authoritative SHA256SUMS.txt,
  # uploads it to the release, and publishes the draft.
  finalize-release:
    name: Finalize Release (Checksums & Publish)
    needs: [create-release, native-windows, native-appimage, native-macos, ocr-engine, android-apk]
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate unified SHA256SUMS and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_WINDOWS: ${{ needs.native-windows.result }}
          NATIVE_APPIMAGE: ${{ needs.native-appimage.result }}
          NATIVE_MACOS: ${{ needs.native-macos.result }}
          OCR_ENGINE: ${{ needs.ocr-engine.result }}
          ANDROID_APK: ${{ needs.android-apk.result }}
        run: |
          set -e
          TAG="${{ needs.create-release.outputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF#refs/tags/}"

          echo "Downloading all assets for release $TAG..."
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets --repo "$GITHUB_REPOSITORY" || true

          cd release-assets
          rm -f SHA256SUMS*

          cd ..

      - name: Generate SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ needs.create-release.outputs.tag }}"
          cd release-assets
          rm -f SHA256SUMS*
          sha256sum * > ../SHA256SUMS.txt
          cd ..
          cat SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"

      - name: Sign the checksums with cosign (keyless, sigstore transparency log)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ needs.create-release.outputs.tag }}"
          curl -sSfL -o cosign https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64
          chmod +x cosign
          ./cosign sign-blob --yes \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt.sig SHA256SUMS.txt.pem --clobber --repo "$GITHUB_REPOSITORY"

      - name: Sign the checksums with GPG (optional, secret-gated)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -e
          TAG="${{ needs.create-release.outputs.tag }}"
          if [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "No GPG_PRIVATE_KEY secret - skipping the GPG signature (cosign signature is still published)."
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback ${GPG_PASSPHRASE:+--passphrase "$GPG_PASSPHRASE"} \
            --armor --detach-sign --output SHA256SUMS.txt.asc SHA256SUMS.txt
          gpg --verify SHA256SUMS.txt.asc SHA256SUMS.txt
          gh release upload "$TAG" SHA256SUMS.txt.asc --clobber --repo "$GITHUB_REPOSITORY"

          # Guard: never publish a release whose artifact set is incomplete.
          # (v1.8.0 shipped without the AppImage and macOS bundle because the
          # native jobs died on a 404; the release was published anyway.)
          INCOMPLETE=0
          for job in "native-windows=$NATIVE_WINDOWS" \
                     "native-appimage=$NATIVE_APPIMAGE" \
                     "native-macos=$NATIVE_MACOS" \
                     "ocr-engine=$OCR_ENGINE" \
                     "android-apk=$ANDROID_APK"; do
            name="${job%%=*}"
            result="${job#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::build job '$name' finished as '$result'"
              INCOMPLETE=1
            fi
          done
          if [ "$INCOMPLETE" -ne 0 ]; then
            echo "Artifact set is incomplete — leaving $TAG as a draft."
            exit 1
          fi

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.draft }}" = "false" ]; then
            echo "Publishing release $TAG..."
            gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi

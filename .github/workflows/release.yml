name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Pre-flight step: ensures the GitHub Release exists before any parallel
  # builder attempts to upload assets to it. This eliminates the race condition
  # where fast native builders finish before tauri-action creates the release.
  create-release:
    name: Prepare GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag and version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v$(node -p "require('./package.json').version")"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ steps.vars.outputs.tag }}"
          NOTES="docs/releases/${TAG}.md"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            echo "Creating draft release $TAG..."
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" \
                --title "CapsuleCraft $TAG" \
                --draft \
                --notes-file "$NOTES" \
                --repo "$GITHUB_REPOSITORY"
            else
              gh release create "$TAG" \
                --title "CapsuleCraft $TAG" \
                --draft \
                --generate-notes \
                --repo "$GITHUB_REPOSITORY"
            fi
          fi

  # Native Windows shell: standalone egui executable packaged as a zero-dependency
  # portable zip. Runs natively without WebView2 runtime or installer required.
  native-windows:
    name: Native Windows app (x64)
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build native shell
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Package Windows portable zip
        shell: pwsh
        run: |
          $Version = "${{ needs.create-release.outputs.version }}"
          $OutDir = "CapsuleCraft_native_${Version}_x64"
          New-Item -ItemType Directory -Path $OutDir -Force
          Copy-Item native/target/release/capsuleos-native.exe "$OutDir/CapsuleCraft.exe"
          Copy-Item README.md, LICENSE "$OutDir/"
          Compress-Archive -Path "$OutDir/*" -DestinationPath "${OutDir}.zip" -Force
          Get-Item "${OutDir}.zip"

      - name: Upload Windows native zip to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $Tag = "${{ needs.create-release.outputs.tag }}"
          $Version = "${{ needs.create-release.outputs.version }}"
          $ZipName = "CapsuleCraft_native_${Version}_x64.zip"
          gh release upload $Tag $ZipName --clobber --repo $env:GITHUB_REPOSITORY

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsulecraft-native-windows-x64
          path: CapsuleCraft_native_*_x64.zip

  # The recommended Linux artifact: the native egui shell as a standalone,
  # zero-dependency AppImage. Built on ubuntu-22.04 so the bundled binary
  # references glibc 2.35 (not a rolling-distro glibc), which keeps the
  # package self-contained per the appimage.github.io catalog checks.
  native-appimage:
    name: Native AppImage (zero-dep, ubuntu-22.04)
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl file \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb1-dev libx11-dev libx11-xcb-dev \
            libwayland-dev \
            libfontconfig1-dev libfreetype6-dev \
            libssl-dev \
            libasound2-dev pkg-config \
            libxkbcommon-x11-0 libxkbcommon0 \
            libx11-6 libx11-xcb1 libxcb1 \
            libxcursor1 libxrandr2 libxi6 \
            libxfixes3 libxrender1 libxext6 \
            libxau6 libxdmcp6 \
            libwayland-client0

      - name: Build native shell
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Assemble AppDir
        run: |
          set -e
          APPDIR=native/packaging/AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR"/usr/bin \
                   "$APPDIR"/usr/lib \
                   "$APPDIR"/usr/share/applications \
                   "$APPDIR"/usr/share/icons/hicolor/256x256/apps
          install -m 0755 native/target/release/capsuleos-native "$APPDIR"/usr/bin/capsuleos-native
          cp src-tauri/icons/128x128@2x.png \
             "$APPDIR"/usr/share/icons/hicolor/256x256/apps/capsulecraft.png
          ln -s usr/bin/capsuleos-native "$APPDIR"/AppRun
          ln -s capsulecraft.png "$APPDIR"/.DirIcon
          # winit/x11-dl/xkbcommon-dl load these with dlopen() at runtime, which
          # linuxdeploy cannot see (no DT_NEEDED). Bundle them (plus transitive
          # deps) explicitly so the app works in minimal/firejail environments.
          LIB=/usr/lib/x86_64-linux-gnu
          for f in \
            libxkbcommon.so.0 libxkbcommon-x11.so.0 \
            libX11.so.6 libX11-xcb.so.1 libxcb.so.1 \
            libXcursor.so.2 libXrandr.so.2 libXi.so.6 \
            libXfixes.so.3 libXrender.so.1 libXext.so.6 \
            libXau.so.6 libXdmcp.so.6 \
            libwayland-client.so.0 libffi.so.8 \
            ; do
            cp -L "$LIB/$f" "$APPDIR"/usr/lib/ || echo "WARN: missing $LIB/$f"
          done
          # Make sure nothing inside the AppImage points at a missing file.
          if find "$APPDIR"/usr/lib -xtype l | grep -q .; then
            echo "ERROR: broken symlinks in AppDir/usr/lib:"
            find "$APPDIR"/usr/lib -xtype l -printf '%p -> %l\n'
            exit 1
          fi
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=CapsuleCraft' \
            'GenericName=Knowledge base as mail' \
            'Comment=Your knowledge base is a folder of emails (.eml). Offline, zero DB.' \
            'Exec=capsuleos-native' \
            'Icon=capsulecraft' \
            'Categories=Office;TextEditor;Development;' \
            'Keywords=notes;knowledge;eml;email;offline;' \
            'StartupWMClass=capsuleos-native' \
            'Type=Application' \
            'Terminal=false' \
            > native/packaging/AppDir/usr/share/applications/capsulecraft.desktop
          mkdir -p native/packaging/AppDir/usr/share/metainfo
          VERSION="${{ needs.create-release.outputs.version }}"
          RELDATE="$(date -u +%Y-%m-%d)"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<component type="desktop-application">' \
            '  <id>com.capsuleos.CapsuleCraft</id>' \
            '  <name>CapsuleCraft</name>' \
            '  <summary>Offline knowledge base stored as a folder of .eml files</summary>' \
            '  <metadata_license>MIT</metadata_license>' \
            '  <project_license>MIT</project_license>' \
            '  <description>' \
            '    <p>CapsuleCraft stores every note as a standards-compliant email (.eml) file in a folder you own. No database, no account, no network required.</p>' \
            '    <p>Native egui shell, built-in FAQ, Markdown blocks, attachments, search, and an optional IMAP mailbox sync.</p>' \
            '  </description>' \
            '  <launchable type="desktop-id">capsulecraft.desktop</launchable>' \
            '  <url type="homepage">https://github.com/kostyk348/CapsuleCraft</url>' \
            '  <categories>' \
            '    <category>Office</category>' \
            '    <category>Utility</category>' \
            '  </categories>' \
            '  <releases>' \
            "    <release version=\"${VERSION}\" date=\"${RELDATE}\"/>" \
            '  </releases>' \
            '</component>' \
            > native/packaging/AppDir/usr/share/metainfo/com.capsuleos.CapsuleCraft.appdata.xml

      - name: Package AppImage (linuxdeploy, bundles shared libs)
        run: |
          set -e
          curl -sSL -o linuxdeploy.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy.AppImage
          export VERSION="${{ needs.create-release.outputs.version }}"
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy.AppImage \
            --appdir native/packaging/AppDir \
            -d native/packaging/AppDir/usr/share/applications/capsulecraft.desktop \
            -i native/packaging/AppDir/usr/share/icons/hicolor/256x256/apps/capsulecraft.png \
            --output appimage
          FILE="CapsuleCraft_${VERSION}_amd64.AppImage"
          OUT=$(find . -maxdepth 1 -name '*.AppImage' ! -name 'linuxdeploy*' -print -quit)
          [ -n "$OUT" ] || { ls; echo "linuxdeploy produced no AppImage"; exit 1; }
          mv -f "$OUT" "$FILE"
          test -f "$FILE"

      - name: Upload AppImage to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ needs.create-release.outputs.tag }}"
          VERSION="${{ needs.create-release.outputs.version }}"
          FILE="CapsuleCraft_${VERSION}_amd64.AppImage"
          gh release upload "$TAG" "$FILE" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsulecraft-native-appimage
          path: CapsuleCraft_*_amd64.AppImage

  # Native macOS bundle: the same egui shell assembled into a .app with an
  # ad-hoc signature, so an unzipped local launch is not blocked outright.
  native-macos:
    name: Native macOS app (arm64)
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Build native shell
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Assemble .app bundle
        run: |
          set -e
          VERSION="${{ needs.create-release.outputs.version }}"
          APP=CapsuleCraft.app
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          install -m 0755 native/target/release/capsuleos-native "$APP/Contents/MacOS/capsuleos-native"
          cp src-tauri/icons/icon.icns "$APP/Contents/Resources/capsulecraft.icns"
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict>' \
            '  <key>CFBundleName</key><string>CapsuleCraft</string>' \
            '  <key>CFBundleDisplayName</key><string>CapsuleCraft</string>' \
            '  <key>CFBundleIdentifier</key><string>com.capsuleos.capsulecraft</string>' \
            '  <key>CFBundleExecutable</key><string>capsuleos-native</string>' \
            '  <key>CFBundleIconFile</key><string>capsulecraft</string>' \
            '  <key>CFBundlePackageType</key><string>APPL</string>' \
            "  <key>CFBundleShortVersionString</key><string>${VERSION}</string>" \
            "  <key>CFBundleVersion</key><string>${VERSION}</string>" \
            '  <key>LSMinimumSystemVersion</key><string>11.0</string>' \
            '  <key>NSHighResolutionCapable</key><true/>' \
            '</dict>' \
            '</plist>' \
            > "$APP/Contents/Info.plist"
          codesign --force --deep --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" \
            "CapsuleCraft_native_${VERSION}_arm64.app.zip"

      - name: Upload macOS app to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ needs.create-release.outputs.tag }}"
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release upload "$TAG" \
            "CapsuleCraft_native_${VERSION}_arm64.app.zip" \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: capsulecraft-native-macos
          path: CapsuleCraft_native_*_arm64.app.zip

  # Legacy Tauri / Web bundles for parity
  build:
    name: ${{ matrix.name }}
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows x64 (msi + nsis)
            cache-key: windows-x64
            bundles: msi,nsis
          - platform: ubuntu-22.04
            name: Linux x64 (deb + rpm)
            cache-key: linux-x64
            bundles: deb,rpm
          - platform: macos-latest
            name: macOS arm64 (app + dmg)
            cache-key: macos-arm64
            bundles: app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.cache-key }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.create-release.outputs.tag }}
          releaseName: CapsuleCraft ${{ needs.create-release.outputs.tag }}
          args: --bundles ${{ matrix.bundles }}
          releaseDraft: true
          prerelease: false

      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: capsuleos-${{ matrix.cache-key }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/dmg/*.dmg

  # Finalization step: runs once all parallel build jobs have finished.
  # Downloads all release assets, computes a single authoritative SHA256SUMS.txt,
  # uploads it to the release, and publishes the draft.
  finalize-release:
    name: Finalize Release (Checksums & Publish)
    needs: [create-release, native-windows, native-appimage, native-macos, build]
    if: always() && needs.create-release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate unified SHA256SUMS and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_WINDOWS: ${{ needs.native-windows.result }}
          NATIVE_APPIMAGE: ${{ needs.native-appimage.result }}
          NATIVE_MACOS: ${{ needs.native-macos.result }}
          TAURI_BUILD: ${{ needs.build.result }}
        run: |
          set -e
          TAG="${{ needs.create-release.outputs.tag }}"
          [ -n "$TAG" ] || TAG="${GITHUB_REF#refs/tags/}"

          echo "Downloading all assets for release $TAG..."
          mkdir -p release-assets
          gh release download "$TAG" --dir release-assets --repo "$GITHUB_REPOSITORY" || true

          cd release-assets
          rm -f SHA256SUMS*

          if ls * >/dev/null 2>&1; then
            echo "Calculating checksums for all release assets:"
            sha256sum * | tee ../SHA256SUMS.txt
            gh release upload "$TAG" ../SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
          fi
          cd ..

          # Guard: never publish a release whose artifact set is incomplete.
          # (v1.8.0 shipped without the AppImage and macOS bundle because the
          # native jobs died on a 404; the release was published anyway.)
          INCOMPLETE=0
          for job in "native-windows=$NATIVE_WINDOWS" \
                     "native-appimage=$NATIVE_APPIMAGE" \
                     "native-macos=$NATIVE_MACOS" \
                     "tauri=$TAURI_BUILD"; do
            name="${job%%=*}"
            result="${job#*=}"
            if [ "$result" != "success" ]; then
              echo "::error::build job '$name' finished as '$result'"
              INCOMPLETE=1
            fi
          done
          if [ "$INCOMPLETE" -ne 0 ]; then
            echo "Artifact set is incomplete — leaving $TAG as a draft."
            exit 1
          fi

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.draft }}" = "false" ]; then
            echo "Publishing release $TAG..."
            gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
          fi

name: Android

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "native/**"
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  apk:
    name: Debug APK (arm64-v8a)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: native

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          # AGP 8.7.x needs Gradle >= 8.9; pin instead of trusting the runner.
          gradle-version: "8.10.2"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build native lib (arm64-v8a)
        working-directory: native
        run: cargo ndk -t arm64-v8a -o ../android/app/src/main/jniLibs build --release

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: CapsuleCraft-debug-arm64
          path: android/app/build/outputs/apk/debug/*.apk

[package]
name = "capsuleos-native"
version = "2.12.2"
edition = "2021"
description = "CapsuleCraft native egui prototype (same .eml vault, no webview)"
license = "MIT"
publish = false

# Android (NativeActivity) loads the app as a shared library exporting
# android_main — the same src/main.rs is therefore also a cdylib target.
# Desktop builds/releases target the bin explicitly (--bin capsuleos-native);
# CI's Android job builds --lib (cargo ndk) to get libcapsuleos_native.so.
[lib]
name = "capsuleos_native"
path = "src/main.rs"
crate-type = ["cdylib"]

[[bin]]
name = "capsuleos-native"
path = "src/main.rs"

[dependencies]
# eframe is declared per-target (see the two `cfg(...)` blocks below): its
# features are additive, and eframe forbids accesskit together with
# android-native-activity — so the desktop stack and the Android stack must
# not share one declaration.
egui = "0.37.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
png = "0.17"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
imap = "2.4"
native-tls = "0.2"
rodio = "0.20"
cpal = "0.15"
boa_engine = "0.20"
pgp = "0.15"
rand = "0.8"
ignore = "0.4"

# Downloadable integrations (v1.12.0): components catalog, viewers, local AI.
# Every crate here is pure Rust except pdfium-render, which loads the pdfium
# shared library at runtime — the library itself is a downloadable component.
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
tar = "0.4"
flate2 = "1"
bzip2-rs = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pdfium-render = { version = "0.9", features = ["image_025"] }
libloading = "0.8"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.21"
# whisper sampling uses the rand 0.9 API (candle's tree); the app's crypto
# stays on 0.8 — both coexist.
rand09 = { package = "rand", version = "0.9" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# Desktop shell: full feature set, accesskit included.
[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "glow", "wayland", "x11"] }
# Native file dialogs exist on desktop targets only; on Android the
# util::dialog shim answers None until the SAF picker lands.
rfd = "0.17.2"
# Page files go to the OS trash instead of being deleted outright.
# (No trash service on Android — the shim falls back to plain deletes.)
trash = "5"

# Android (NativeActivity): the same egui app as a NativeActivity. The
# desktop features (x11/wayland/glow) are inert here; winit drives the Android
# event loop through android-activity's native-activity backend, which is what
# the manifest's `android.app.NativeActivity` requires. eframe 0.37 forbids
# accesskit together with that backend (compile_error in eframe), so the
# desktop-only accesskit feature is not enabled on this target. Before
# v2.12.0 this section wrongly asked for `android-game-activity` while the
# manifest shipped NativeActivity — the .so exported no
# `ANativeActivity_onCreate` and the app crashed instantly on launch.
# CI builds the APK — see .github/workflows/android.yml and docs/android.md.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    "clipboard",
    "default_fonts",
    "links",
    "glow",
    "android-native-activity",
] }
# Same major as winit's copy so the `AndroidApp` handle types unify; the
# backend feature must match the manifest (NativeActivity).
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.14"
log = "0.4"
# native-tls (imap/ureq) lands on openssl-sys; cross-compiling needs the
# vendored build — the NDK has no system OpenSSL to link against.
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
opt-level = 2
lto = "thin"

# Keep dev artifacts small enough for constrained CI runners: line tables
# preserve backtraces without the multi-GB DWARF of full debug info.
[profile.dev]
debug = "line-tables-only"

# Dependency crates build with no debug info at all: the candle/tokenizers
# stack otherwise inflates debug artifacts past small disk quotas.
[profile.dev.package."*"]
debug = false

[profile.test]
debug = false
incremental = false
opt-level = 0



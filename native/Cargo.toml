[package]
name = "capsuleos-native"
version = "1.12.4"
edition = "2021"
description = "CapsuleCraft native egui prototype (same .eml vault, no webview)"
license = "MIT"
publish = false

[[bin]]
name = "capsuleos-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "glow", "wayland", "x11"] }
egui = "0.37.0"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
png = "0.17"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
imap = "2.4"
native-tls = "0.2"
rodio = "0.20"
cpal = "0.15"
boa_engine = "0.20"
pgp = "0.15"
rand = "0.8"
ignore = "0.4"

# Downloadable integrations (v1.12.0): components catalog, viewers, local AI.
# Every crate here is pure Rust except pdfium-render, which loads the pdfium
# shared library at runtime — the library itself is a downloadable component.
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
tar = "0.4"
flate2 = "1"
bzip2-rs = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pdfium-render = { version = "0.9", features = ["image_025"] }
libloading = "0.8"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.21"
# whisper sampling uses the rand 0.9 API (candle's tree); the app's crypto
# stays on 0.8 — both coexist.
rand09 = { package = "rand", version = "0.9" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
lto = "thin"

# Keep dev artifacts small enough for constrained CI runners: line tables
# preserve backtraces without the multi-GB DWARF of full debug info.
[profile.dev]
debug = "line-tables-only"

# Dependency crates build with no debug info at all: the candle/tokenizers
# stack otherwise inflates debug artifacts past small disk quotas.
[profile.dev.package."*"]
debug = false

[profile.test]
debug = false
incremental = false
opt-level = 0



[package]
name = "capsuleos-native"
version = "1.8.1"
edition = "2021"
description = "CapsuleCraft native egui prototype (same .eml vault, no webview)"
license = "MIT"
publish = false

[[bin]]
name = "capsuleos-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "glow", "wayland", "x11"] }
egui = "0.37.0"
rfd = "0.17.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
png = "0.17"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
imap = "2.4"
native-tls = "0.2"
rodio = "0.20"
boa_engine = "0.20"
pgp = "0.15"
rand = "0.8"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 2
lto = "thin"

# Keep dev artifacts small enough for constrained CI runners: line tables
# preserve backtraces without the multi-GB DWARF of full debug info.
[profile.dev]
debug = "line-tables-only"

[package]
name = "capsuleos-native"
version = "2.9.0"
edition = "2021"
description = "CapsuleCraft native egui prototype (same .eml vault, no webview)"
license = "MIT"
publish = false

[[bin]]
name = "capsuleos-native"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "links", "system_fonts", "glow", "wayland", "x11"] }
egui = "0.37.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
png = "0.17"
notify = "8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
imap = "2.4"
native-tls = "0.2"
rodio = "0.20"
cpal = "0.15"
boa_engine = "0.20"
pgp = "0.15"
rand = "0.8"
ignore = "0.4"
# Page files go to the OS trash instead of being deleted outright.
trash = "5"

# Downloadable integrations (v1.12.0): components catalog, viewers, local AI.
# Every crate here is pure Rust except pdfium-render, which loads the pdfium
# shared library at runtime — the library itself is a downloadable component.
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
tar = "0.4"
flate2 = "1"
bzip2-rs = "0.1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pdfium-render = { version = "0.9", features = ["image_025"] }
libloading = "0.8"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = "0.21"
# whisper sampling uses the rand 0.9 API (candle's tree); the app's crypto
# stays on 0.8 — both coexist.
rand09 = { package = "rand", version = "0.9" }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

# Native file dialogs exist on desktop targets only; on Android the
# util::dialog shim answers None until the SAF picker lands.
[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = "0.17.2"

# Android (scaffold, v2.9.0): the same egui app as a NativeActivity. The
# desktop eframe features (x11/wayland/glow) are inert on this target; winit
# drives the Android event loop through android-activity instead. CI builds
# the APK — see .github/workflows/android.yml and docs/android.md.
[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = [
    # accesskit on Android is wired only through game-activity (eframe
    # compile_error otherwise) — game-activity is the modern backend anyway.
    "accesskit",
    "clipboard",
    "default_fonts",
    "links",
    "android-game-activity",
] }
# Same major as winit's copy so the `AndroidApp` handle types unify.
android-activity = "0.6"
android_logger = "0.14"
log = "0.4"
# native-tls (imap/ureq) lands on openssl-sys; cross-compiling needs the
# vendored build — the NDK has no system OpenSSL to link against.
openssl = { version = "0.10", features = ["vendored"] }

[profile.release]
opt-level = 2
lto = "thin"

# Keep dev artifacts small enough for constrained CI runners: line tables
# preserve backtraces without the multi-GB DWARF of full debug info.
[profile.dev]
debug = "line-tables-only"

# Dependency crates build with no debug info at all: the candle/tokenizers
# stack otherwise inflates debug artifacts past small disk quotas.
[profile.dev.package."*"]
debug = false

[profile.test]
debug = false
incremental = false
opt-level = 0


